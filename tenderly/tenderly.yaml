# Tenderly Web3 Actions configuration for Aave Governance V3 robot.
#
# Replaces (in parallel, then deprecates) the on-chain Chainlink Automation keepers.
# Every action function lives under src/tenderly/. Helpers live under src/core/ and
# src/orchestration/ — they are imported by both Tenderly Actions and the CLI.
#
# Required secrets (configured via Tenderly UI or `tenderly actions secret set`):
#   PRIVATE_KEY           Hex private key for the signer EOA.
#   ALCHEMY_API_KEY       (recommended) Auto-builds RPC URLs for every chain via Alchemy.
#                         The L1 RPC must support eth_getProof — Alchemy does.
#   RPC_<NETWORK>         (optional) Per-chain override; names match @bgd-labs/toolbox
#                         getNetworkEnv() (e.g. RPC_MAINNET, RPC_POLYGON, RPC_AVALANCHE).

account_id: "aave" # Tenderly account/org slug — fill in before deploy
project_slug: "governance-v3" # Tenderly project slug — fill in before deploy

specs:
  governance-scan:
    description: "Scan Aave governance on Ethereum for activate/execute/cancel"
    function: src/tenderly/index:governanceAction
    trigger:
      type: periodic
      periodic:
        interval: 1m

  voting-activated-listener:
    description: "On L1 VotingActivated event, fetch proofs and submit to voting chain"
    function: src/tenderly/index:votingActivatedListener
    trigger:
      type: transaction
      transaction:
        status:
          - mined
        filters:
          - network: 1
            # Aave Governance V3 on Ethereum
            to: "0x9AEE0B04504CeF83A65AC3f0e838D0593BCb2BC7"
            eventEmitted:
              # keccak256("VotingActivated(uint256,bytes32,uint24)")
              contract:
                address: "0x9AEE0B04504CeF83A65AC3f0e838D0593BCb2BC7"
              name: "VotingActivated"

  voting-scan-ethereum:
    description: "Scan voting machine on Ethereum (catches anything the event listener missed)"
    function: src/tenderly/index:votingEthereum
    trigger: { type: periodic, periodic: { interval: 2m } }

  voting-scan-polygon:
    description: "Scan voting machine on Polygon"
    function: src/tenderly/index:votingPolygon
    trigger: { type: periodic, periodic: { interval: 2m } }

  voting-scan-avalanche:
    description: "Scan voting machine on Avalanche"
    function: src/tenderly/index:votingAvalanche
    trigger: { type: periodic, periodic: { interval: 2m } }

  exec-scan-ethereum:
    function: src/tenderly/index:execEthereum
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-polygon:
    function: src/tenderly/index:execPolygon
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-avalanche:
    function: src/tenderly/index:execAvalanche
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-arbitrum:
    function: src/tenderly/index:execArbitrum
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-optimism:
    function: src/tenderly/index:execOptimism
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-base:
    function: src/tenderly/index:execBase
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-bnb:
    function: src/tenderly/index:execBnb
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-gnosis:
    function: src/tenderly/index:execGnosis
    trigger: { type: periodic, periodic: { interval: 2m } }
  exec-scan-metis:
